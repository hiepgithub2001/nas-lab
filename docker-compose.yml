# Explicit project name, matching what Compose already derives from the
# directory. It matters because docker-compose.cloud.yml sits in this same
# directory: without a name of its own each file would claim the project
# `nas-lab`, and either stack's `--remove-orphans` would delete the other's
# containers. That file declares `name: nas-cloud`.
name: nas-lab

# Container logs default to json-file with no size limit, which grows unbounded
# until it fills the WSL ext4 root. Cap every service at 30 MB (3 x 10 MB).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    logging: *default-logging
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - 9696:9696

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    logging: *default-logging
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    ports:
      - 8191:8191

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    logging: *default-logging
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - 7878:7878

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    logging: *default-logging
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - 8989:8989

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    logging: *default-logging
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - 6767:6767

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    logging: *default-logging
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}:/data
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "${PUID}:${PGID}"
    restart: "no"
    logging: *default-logging
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/recyclarr:/config

  jellyfin:
    # Tracks upstream, majors included: `compose pull` takes whatever :latest
    # points at that day. 10.11.11 -> 12.0 arrived this way on 2026-09-08, and
    # 12.0's database migration cannot be rolled back without a full restore, so
    # back up appdata/jellyfin before pulling. Plain `up -d` is safe — it reuses
    # the local image and never re-resolves the tag.
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    logging: *default-logging
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    # Intel Iris Xe (Raptor Lake-P) via QSV, replacing the RTX 4080's NVENC on
    # 2026-08-10. The render node is root:render, and render is GID 993 on this
    # host — without group_add the container opens /dev/dri and gets EACCES, then
    # silently falls back to software transcoding.
    # The LSIO image ships its own Intel media driver, so the host needs none.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "993"
    # Partial workaround for an ISP block on themoviedb.org, not a fix. Read the
    # measurements before assuming this makes TMDB work — it does not.
    #
    # The block has two layers. The first is a DNS sinkhole: the ISP's resolver
    # answers api.themoviedb.org with 127.0.0.1 (NOERROR, decrementing TTL, so it
    # is relayed from upstream rather than invented by the router — no router
    # setting fixes it). Jellyfin then dials itself on :443 and logs "Connection
    # refused" in microseconds. These lines below defeat that layer.
    #
    # The second layer survives them. TCP to the real CloudFront edges opens
    # fine, then the TLS session is reset — the same IP succeeds and fails
    # minutes apart, which points at DPI on the TLS SNI rather than an IP or port
    # rule. Measured 2026-09-09 over 20 trials each: 3/20 from this container
    # with these servers, and 3/20 from the host with DNS bypassed entirely via
    # --resolve. Identical, which is what proves DNS is no longer the binding
    # constraint. Before the change it was 0/20, so this is worth keeping.
    #
    # Net effect: TMDB metadata goes from never working to working ~15% of the
    # time. Artwork for new movies is unreliable; the 424 already in the library
    # keep the posters they have. Anything better needs the traffic to leave via
    # a path the ISP cannot inspect.
    #
    # Only Jellyfin needs this. Radarr goes through api.radarr.video and Sonarr
    # through skyhook.sonarr.tv, neither of which is on the block list — verified
    # in 48h of their logs, zero TMDB calls and zero metadata errors.
    #
    # Docker keeps its embedded resolver at 127.0.0.11 for container-name lookups
    # and forwards only external queries here, so service discovery is unaffected.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media
    ports:
      - 8096:8096

  # --- Monitoring ---------------------------------------------------------
  # Beszel: host + container health with history and alerts. Hub is the web UI,
  # agent collects. See docs/technical/MONITORING.md.
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/beszel/data:/beszel_data
      - ${CONFIG_ROOT}/beszel/socket:/beszel_socket
    ports:
      # 8090 is Beszel's default but is already held by a Windows process that
      # WSL forwards localhost to, so the bind fails. 8091 on the host instead.
      - 8091:8090

  # Plain agent, not the -nvidia build: this host has an Intel iGPU and the
  # NVIDIA variant would only fail to find nvidia-smi. The GPU box runs its own
  # agent from docker-compose.gpu.yml and reports in over the tailnet.
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    environment:
      - TZ=${TZ}
      - LISTEN=/beszel_socket/beszel.sock
      - KEY=${BESZEL_KEY}
    volumes:
      - ${CONFIG_ROOT}/beszel/socket:/beszel_socket
      - ${CONFIG_ROOT}/beszel/agent:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # systemd service monitoring — without these the agent can't talk to
      # systemd and tailscaled/postgresql go unwatched.
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/run/systemd/private:/var/run/systemd/private:ro
      # Extra disks are monitored by bind-mounting them here. Both target
      # volumes are watched: the SSD holds appdata, the HDD holds the library
      # and is the one that actually fills up.
      - /mnt/ssd:/extra-filesystems/mnt-ssd:ro
      - /mnt/hdd:/extra-filesystems/mnt-hdd:ro
