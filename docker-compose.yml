# Container logs default to json-file with no size limit, which grows unbounded
# until it fills the WSL ext4 root. Cap every service at 30 MB (3 x 10 MB).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    logging: *default-logging
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - 9696:9696

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    logging: *default-logging
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    ports:
      - 8191:8191

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    logging: *default-logging
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - 7878:7878

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    logging: *default-logging
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - 8989:8989

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    logging: *default-logging
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - 6767:6767

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    logging: *default-logging
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}:/data
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "${PUID}:${PGID}"
    restart: "no"
    logging: *default-logging
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/recyclarr:/config

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    logging: *default-logging
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # NVIDIA GPU (RTX 4080 Super) for NVENC hardware transcoding
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media
      # WSL2 GPU driver libs, read live from the host. Without this the NVIDIA
      # toolkit copies them in once at creation, and a later Windows driver
      # update leaves the container stale -> "GPU access blocked by the OS".
      - /usr/lib/wsl:/usr/lib/wsl:ro
    ports:
      - 8096:8096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --- LLM ----------------------------------------------------------------
  # Local model server, used for English -> Vietnamese subtitle translation.
  # See docs/technical/LLM-SUBTITLES.md.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TZ=${TZ}
      # Unload the model once idle. Jellyfin's NVENC transcodes and this share
      # the same 16 GB of VRAM, and a loaded model squatting on ~5-9 GB is how
      # a 4K HDR transcode ends up failing.
      - OLLAMA_KEEP_ALIVE=5m
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # Models go on the ext4 root (~900 GB free), never /mnt/f (12 GB, 9p).
      - ${CONFIG_ROOT}/ollama:/root/.ollama
      - /usr/lib/wsl:/usr/lib/wsl:ro
    ports:
      - 11434:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Chat UI for the Ollama server above: model picker, editable system prompt
  # and per-request options, so translation prompts can be compared without
  # hand-writing curl calls. CPU-only, no GPU reservation.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TZ=${TZ}
      # Reached over the compose network, so this keeps working regardless of
      # what the host publishes 11434 as.
      - OLLAMA_BASE_URL=http://ollama:11434
      # This box runs local models only. Left on, the OpenAI integration probes
      # api.openai.com at every start and stalls the model list when it fails.
      - ENABLE_OPENAI_API=false
    volumes:
      - ${CONFIG_ROOT}/open-webui:/app/backend/data
    ports:
      # Serves on 8080 inside the container; 8080 on the host is qbittorrent.
      - 3000:8080

  # --- Monitoring ---------------------------------------------------------
  # Beszel: host + container health with history and alerts. Hub is the web UI,
  # agent collects. See docs/technical/MONITORING.md.
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/beszel/data:/beszel_data
      - ${CONFIG_ROOT}/beszel/socket:/beszel_socket
    ports:
      # 8090 is Beszel's default but is already held by a Windows process that
      # WSL forwards localhost to, so the bind fails. 8091 on the host instead.
      - 8091:8090

  beszel-agent:
    image: henrygd/beszel-agent-nvidia:latest
    container_name: beszel-agent
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    environment:
      - TZ=${TZ}
      - LISTEN=/beszel_socket/beszel.sock
      - KEY=${BESZEL_KEY}
    volumes:
      - ${CONFIG_ROOT}/beszel/socket:/beszel_socket
      - ${CONFIG_ROOT}/beszel/agent:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # systemd service monitoring — without these the agent can't talk to
      # systemd and tailscaled/postgresql go unwatched.
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/run/systemd/private:/var/run/systemd/private:ro
      # Extra disks are monitored by bind-mounting them here. Without this the
      # media drive - the one that actually fills up - is invisible.
      - /mnt/f:/extra-filesystems/mnt-f:ro
      # nvidia-smi for GPU stats, same pattern as Jellyfin
      - /usr/lib/wsl:/usr/lib/wsl:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
