# Per-application health for the stack. Container "running" is not the same as
# the app answering — this checks the actual HTTP endpoints, with response time.
# Netdata runs with network_mode: host, so localhost reaches the published ports.
jobs:
  - name: jellyfin
    url: http://localhost:8096/health
    status_accepted: [200]

  - name: radarr
    url: http://localhost:7878
    status_accepted: [200, 302]

  - name: sonarr
    url: http://localhost:8989
    status_accepted: [200, 302]

  - name: prowlarr
    url: http://localhost:9696
    status_accepted: [200, 302]

  - name: bazarr
    url: http://localhost:6767
    status_accepted: [200, 302]

  - name: qbittorrent
    url: http://localhost:8080
    status_accepted: [200, 302]

  - name: flaresolverr
    url: http://localhost:8191
    status_accepted: [200]
