[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-dubbing"
version = "0.1.0"
description = "Resumable Vietnamese AI voice-over pipeline for Radarr and Jellyfin"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PyYAML==6.0.2",
]

[project.scripts]
vn-dub = "vn_dubbing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
